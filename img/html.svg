<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="htmlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D060B"/>
      <stop offset="50%" stop-color="#4F0D16"/>
      <stop offset="100%" stop-color="#731422"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#htmlBg)"/>
  
  <!-- Subtle minimal semantic layout blocks -->
  <g opacity="0.18" stroke="#FFFFFF" fill="none" stroke-width="2">
    <!-- Header block -->
    <rect x="250" y="80" width="300" height="40" rx="6"/>
    <!-- Nav block -->
    <rect x="250" y="130" width="300" height="25" rx="4"/>
    <!-- Main content block -->
    <rect x="250" y="165" width="190" height="150" rx="6"/>
    <!-- Aside block -->
    <rect x="450" y="165" width="100" height="150" rx="6"/>
    <!-- Section / Article blocks inside main -->
    <rect x="260" y="180" width="170" height="50" rx="4" fill="rgba(255,255,255,0.05)"/>
    <rect x="260" y="240" width="170" height="60" rx="4" fill="rgba(255,255,255,0.05)"/>
    <!-- Footer block -->
    <rect x="250" y="325" width="300" height="30" rx="4"/>
  </g>

  <!-- Large minimalist HTML tag emblem in background -->
  <g transform="translate(400, 460)" opacity="0.22">
    <path d="M-90 -40 L-140 0 L-90 40" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M90 -40 L140 0 L90 40" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="20" y1="-50" x2="-20" y2="50" stroke="#FF4D6D" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>

