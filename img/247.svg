<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Minimalist Circular Clock Track -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="3" stroke-dasharray="4 4"/>
  <!-- Circular Arrow indicating continuous 24/7 loop -->
  <path d="M50 10 A40 40 0 1 1 14 65" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <polyline points="10,54 14,66 26,62" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Minimalist "24/7" Text inside -->
  <text x="50" y="56" fill="#FF4D6D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="-1">24/7</text>
  <circle cx="50" cy="68" r="3" fill="#FFFFFF"/>
</svg>

