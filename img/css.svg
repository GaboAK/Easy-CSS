<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="cssBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B0A11"/>
      <stop offset="50%" stop-color="#6E121E"/>
      <stop offset="100%" stop-color="#941B29"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#cssBg)"/>

  <!-- Minimalist Flexbox & CSS layout lines -->
  <g opacity="0.18" stroke="#FFFFFF" fill="none" stroke-width="2">
    <!-- Flex container -->
    <rect x="220" y="90" width="360" height="200" rx="12" stroke-dasharray="6 6"/>
    <!-- Flex items -->
    <rect x="245" y="115" width="90" height="150" rx="8" fill="rgba(255,255,255,0.06)"/>
    <rect x="355" y="115" width="90" height="150" rx="8" fill="rgba(255,77,109,0.12)"/>
    <rect x="465" y="115" width="90" height="150" rx="8" fill="rgba(255,255,255,0.06)"/>
  </g>

  <!-- Large minimalist CSS brackets emblem -->
  <g transform="translate(400, 440)" opacity="0.25">
    <path d="M-80 -60 C-110 -60 -120 -40 -120 -20 C-120 -5 -135 0 -150 0 C-135 0 -120 5 -120 20 C-120 40 -110 60 -80 60" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <path d="M80 -60 C110 -60 120 -40 120 -20 C120 -5 135 0 150 0 C135 0 120 5 120 20 C120 40 110 60 80 60" fill="none" stroke="#FF4D6D" stroke-width="8" stroke-linecap="round"/>
    <!-- Central dot -->
    <circle cx="0" cy="0" r="8" fill="#FFFFFF"/>
  </g>
</svg>

