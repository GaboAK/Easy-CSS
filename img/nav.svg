<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <circle cx="50" cy="50" r="42" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <circle cx="50" cy="50" r="4" fill="#FFFFFF"/>
  <!-- Minimalist compass needle -->
  <polygon points="50,18 57,45 50,42" fill="#FF4D6D"/>
  <polygon points="50,18 43,45 50,42" fill="#E63946"/>
  <polygon points="50,82 57,55 50,58" fill="#FFFFFF" opacity="0.6"/>
  <polygon points="50,82 43,55 50,58" fill="#FFFFFF" opacity="0.8"/>
  <!-- Compass ticks -->
  <line x1="50" y1="10" x2="50" y2="15" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="85" x2="50" y2="90" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="10" y1="50" x2="15" y2="50" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="85" y1="50" x2="90" y2="50" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
</svg>

