<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estructura de 22 Cajas con Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        html,
        body {
            width: 100%;
            min-height: 100vh;
        }

        .caja {
            color: #ffffff;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
            height: 100%;
        }

        .caja:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.2);
        }

        /*NAV*/
        .caja1 {
            min-height: 80px;
            background-color: #3b0910;
        }

        /*uno y dos*/
        .caja2 {
            min-height: 200px;
            background-color: #540b14;
            font-size: 1.75rem;
        }

        /*tres y cuatro*/
        .caja3 {
            min-height: 150px;
            background-color: #6e0d19;
            font-size: 1.35rem;
        }

        .caja4 {
            min-height: 150px;
            background-color: #87101e;
            font-size: 1.35rem;
        }

        /*6x3*/
        .caja-grid {
            min-height: 110px;
            font-size: 1.1rem;
        }

        .caja5 {
            background-color: #9e1322;
        }

        .caja6 {
            background-color: #b31828;
        }

        .caja7 {
            background-color: #c91d2f;
        }

        .caja8 {
            background-color: #dc2638;
        }

        .caja9 {
            background-color: #e63946;
        }

        .caja10 {
            background-color: #ee4d5b;
        }

        .caja11 {
            background-color: #d90429;
        }

        .caja12 {
            background-color: #c1121f;
        }

        .caja13 {
            background-color: #a81320;
        }

        .caja14 {
            background-color: #8d0801;
        }

        .caja15 {
            background-color: #780000;
        }

        .caja16 {
            background-color: #640d14;
        }

        .caja17 {
            background-color: #800e13;
        }

        .caja18 {
            background-color: #ad2831;
        }

        .caja19 {
            background-color: #c32f27;
        }

        .caja20 {
            background-color: #d00000;
        }

        .caja21 {
            background-color: #9d0208;
        }

        .caja22 {
            background-color: #480a10;
        }
    </style>
</head>

<body class="bg-white py-4">

    <div class="container-fluid px-3">

        <header class="row mb-4">
            <div class="col-12">
                <nav class="caja caja1 justify-content-between flex-wrap gap-3">
                    <span class="fs-4 text-uppercase">BOX #1</span>
                    <div class="d-flex gap-2 flex-wrap justify-content-center">
                        <a class="btn btn-outline-light" href="index.html" role="button">Estructura y Sintaxis</a>
                        <a class="btn btn-outline-light" href="espec.html" role="button">Niveles de Especifidad</a>
                        <a class="btn btn-outline-light" href="pseudo.html" role="button">PseudoClases y Pseudo
                            Elementos</a>
                        <a class="btn btn-outline-light" href="boxmod.html" role="button">Modelo de Caja</a>
                    </div>
                </nav>
            </div>
        </header>

        <section class="row mb-4">
            <div class="col-12">
                <div class="caja caja2 d-flex flex-column justify-content-center align-items-center gap-3">
                    <span>BOX #2</span>

                </div>
            </div>
        </section>

        <section class="row g-3 mb-4">
            <div class="col-12 col-md-6">
                <div class="caja caja3">
                    BOX #3
                </div>
            </div>
            <div class="col-12 col-md-6">
                <div class="caja caja4">
                    BOX #4
                </div>
            </div>
        </section>

        <section class="mb-4">
            <div class="row g-3 mb-3">
                <div class="col-6 col-sm-4 col-md-2">
                    <div class="caja caja-grid caja5">BOX #5</div>
                </div>
                <div class="col-6 col-sm-4 col-md-2">
                    <div class="caja caja-grid caja6">BOX #6</div>
                </div>
                <div class="col-6 col-sm-4 col-md-2">
                    <div class="caja caja-grid caja7">BOX #7</div>
                </div>
                <div class="col-6 col-sm-4 col-md-2">
                    <div class="caja caja-grid caja8">BOX #8</div>

                <div class="col-6 col-sm-4 col-md-2">
                    <div class="caja caja-grid caja9">BOX #9</div>

                <div class="col-6 col-sm-4 col-md-2">
                    <div class="caja caja-grid caja10">BOX #10</div>
                </div>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-6 col-sm-4 col-md-2">
                    <div class="caja caja-grid caja11">BOX #11</div>
                </div>
                <div class="col-6 col-sm-4 col-md-2">
                    <div class="caja caja-grid caja12">BOX #12</div>
                </div>
                <div class="col-6 col-sm-4 col-md-2">
                    <div class="caja caja-grid caja13">BOX #13</div>
                </div>
                <div class="col-6 col-sm-4 col-md-2">
                    <div class="caja caja-grid caja14">BOX #14</div>
                </div>
                <div class="col-6 col-sm-4 col-md-2">
                    <div class="caja caja-grid caja15">BOX #15</div>
                </div>
                <div class="col-6 col-sm-4 col-md-2">
                    <div class="caja caja-grid caja16">BOX #16</div>
                </div>
            </div>

            <div class="row g-3">
                <div class="col-6 col-sm-4 col-md-2">
                    <div class="caja caja-grid caja17">BOX #17</div>
                </div>
                <div class="col-6 col-sm-4 col-md-2">
                    <div class="caja caja-grid caja18">BOX #18</div>
                </div>
                <div class="col-6 col-sm-4 col-md-2">
                    <div class="caja caja-grid caja19">BOX #19</div>
                </div>
                <div class="col-6 col-sm-4 col-md-2">
                    <div class="caja caja-grid caja20">BOX #20</div>
                </div>
                <div class="col-6 col-sm-4 col-md-2">
                    <div class="caja caja-grid caja21">BOX #21</div>
                </div>
                <div class="col-6 col-sm-4 col-md-2">
                    <div class="caja caja-grid caja22">BOX #22</div>
                </div>
            </div>
        </section>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
